<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8ecf2"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a75d3"/>
      <stop offset="100%" stop-color="#1958a8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Document Page with drop shadow -->
  <rect x="20" y="16" width="88" height="96" rx="8" ry="8" fill="url(#pageGrad)" filter="url(#shadow)"/>

  <!-- Top Decorative Header Strip -->
  <path d="M 20 24 C 20 19.58 23.58 16 28 16 L 100 16 C 104.42 16 108 19.58 108 24 L 108 30 L 20 30 Z" fill="url(#headerGrad)"/>

  <!-- Notepad Ruled Lines -->
  <line x1="32" y1="44" x2="96" y2="44" stroke="#a0b3c6" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="56" x2="88" y2="56" stroke="#b8c8d8" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="68" x2="96" y2="68" stroke="#b8c8d8" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="80" x2="76" y2="80" stroke="#b8c8d8" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="92" x2="90" y2="92" stroke="#b8c8d8" stroke-width="3" stroke-linecap="round"/>

  <!-- Stylish "X" Emblem in NotepadX signature teal/blue -->
  <circle cx="94" cy="94" r="16" fill="#1e88e5" filter="url(#shadow)"/>
  <path d="M 88 88 L 100 100 M 100 88 L 88 100" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
</svg>
