[package]
name = "notepadx"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
sourceview5 = { version = "0.11", features = ["v5_12"] }
glib = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4"] }
crc32fast = "1.4"
thiserror = "2.0"
dirs = "6.0"

[dev-dependencies]
tempfile = "3.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
